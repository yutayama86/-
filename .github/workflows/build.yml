name: Build check

on:
  push:
    branches: [main, fix/ci-runtime-cleanup-20260922]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile for dependency repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/ci-runtime-cleanup-20260922'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh dependency lockfile"
            git push origin HEAD:fix/ci-runtime-cleanup-20260922
          fi
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit diagnostic
        run: npm audit --json || true
      - name: Verify
        run: npm run verify
