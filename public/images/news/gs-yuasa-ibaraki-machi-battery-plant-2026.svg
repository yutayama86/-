<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="2026年8月の発表から2028年10月の供給開始までの時間軸と、工場が建つことで終わらせず県内の取引・人材・保守へ投資を広げるという論点を示した図">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d9d0c0" stroke-width="2"/>

  <text x="100" y="122" font-family="'Source Sans 3', sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#315c68">IBATOCO ・ 茨城ニュース解説</text>

  <text x="100" y="178" font-family="'Source Sans 3', sans-serif" font-size="17" fill="#75695a">茨城町中央工業団地／建屋面積 44,394㎡・生産能力 2GWh/年</text>

  <line x1="104" y1="230" x2="1016" y2="230" stroke="#d9d0c0" stroke-width="2"/>
  <g font-family="'Source Sans 3', sans-serif">
    <circle cx="140" cy="230" r="6" fill="#315c68"/>
    <text x="140" y="262" font-size="17" font-weight="600" fill="#315c68" text-anchor="middle">2026.2</text>
    <text x="140" y="284" font-size="14" fill="#75695a" text-anchor="middle">計画の認定</text>

    <circle cx="420" cy="230" r="6" fill="#315c68"/>
    <text x="420" y="262" font-size="17" font-weight="600" fill="#315c68" text-anchor="middle">2026.8</text>
    <text x="420" y="284" font-size="14" fill="#75695a" text-anchor="middle">茨城町への開設を発表</text>

    <circle cx="1016" cy="230" r="7" fill="#a63f32"/>
    <text x="1016" y="262" font-size="17" font-weight="600" fill="#a63f32" text-anchor="middle">2028.10</text>
    <text x="1016" y="284" font-size="14" fill="#a63f32" text-anchor="middle">供給開始（予定）</text>
  </g>

  <text x="560" y="330" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a" text-anchor="middle">この2年で決まる</text>

  <rect x="100" y="348" width="290" height="46" fill="none" stroke="#315c68" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="245" y="377" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#315c68" text-anchor="middle">県内企業との取引</text>
  <rect x="410" y="348" width="290" height="46" fill="none" stroke="#315c68" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="555" y="377" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#315c68" text-anchor="middle">雇用・人材育成</text>
  <rect x="720" y="348" width="290" height="46" fill="none" stroke="#315c68" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="865" y="377" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#315c68" text-anchor="middle">物流・保守</text>

  <text x="100" y="470" font-family="'Shippori Mincho', serif" font-size="46" font-weight="600" fill="#172b35">工場が建つことは、</text>
  <text x="100" y="524" font-family="'Shippori Mincho', serif" font-size="46" font-weight="600" fill="#172b35">まだ結果ではない。</text>

  <text x="1100" y="500" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a" text-anchor="end">約703億円は供給確保計画全体の事業総額</text>
  <text x="1100" y="530" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a" text-anchor="end">工場の建設費として公表された金額ではない</text>
  <text x="1100" y="560" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a" text-anchor="end">雇用人数・採用計画は未公表</text>
</svg>
