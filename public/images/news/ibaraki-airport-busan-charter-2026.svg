<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="茨城空港に初の釜山便、10月に4往復のチャーター運航へ">
  <defs>
    <style>
      .serif{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;}
      .sans{font-family:'Source Sans 3','Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#d9d0c0" stroke-width="1.5"/>

  <!-- kicker -->
  <text x="80" y="108" class="sans" fill="#315c68" font-size="22" letter-spacing="4" font-weight="600">IBATOCO ・ 茨城ニュース解説</text>

  <!-- flight path from Busan to Ibaraki -->
  <g>
    <path d="M180 205 Q600 120 1020 205" fill="none" stroke="#315c68" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="180" cy="205" r="8" fill="#a63f32"/>
    <circle cx="1020" cy="205" r="8" fill="#172b35"/>
    <text x="180" y="245" class="sans" fill="#75695a" font-size="20" letter-spacing="3" text-anchor="middle">釜山 BUSAN</text>
    <text x="1020" y="245" class="sans" fill="#75695a" font-size="20" letter-spacing="3" text-anchor="middle">茨城 IBARAKI</text>
    <!-- plane heading right, toward Ibaraki -->
    <path d="M612 150 l34 12 l-34 12 l8 -12 z" fill="#172b35" transform="rotate(-6 629 162)"/>
  </g>

  <!-- headline -->
  <text x="80" y="360" class="serif" fill="#172b35" font-size="82" font-weight="700">茨城空港に初の</text>
  <text x="80" y="470" class="serif" fill="#172b35" font-size="104" font-weight="700">「釜山便」<tspan class="serif" font-size="72" fill="#a63f32">。</tspan></text>

  <!-- sub copy -->
  <text x="82" y="540" class="serif" fill="#315c68" font-size="42" font-weight="500">10月、4往復のチャーター運航へ</text>

  <!-- footnote tag -->
  <text x="1120" y="578" class="sans" fill="#75695a" font-size="19" text-anchor="end">エアプサン A321 ／ チャーター便（定期便ではありません）</text>
</svg>
