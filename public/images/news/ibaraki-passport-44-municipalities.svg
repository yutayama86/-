<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="茨城44市町村を巡る旅へ。IBARAKI PASSPORTから考える、これからの茨城観光">
  <defs>
    <style>
      .serif{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;}
      .sans{font-family:'Source Sans 3','Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#d9d0c0" stroke-width="1.5"/>

  <!-- kicker -->
  <text x="80" y="108" class="sans" fill="#315c68" font-size="22" letter-spacing="4" font-weight="600">IBATOCO ・ 茨城ニュース解説</text>

  <!-- points to line: scattered towns threaded by one route -->
  <g>
    <path d="M120 205 L260 170 L400 220 L540 165 L680 210 L820 168 L960 214 L1080 176" fill="none" stroke="#315c68" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="120" cy="205" r="7" fill="#75695a"/>
    <circle cx="260" cy="170" r="7" fill="#75695a"/>
    <circle cx="400" cy="220" r="7" fill="#a63f32"/>
    <circle cx="540" cy="165" r="7" fill="#75695a"/>
    <circle cx="680" cy="210" r="7" fill="#315c68"/>
    <circle cx="820" cy="168" r="7" fill="#75695a"/>
    <circle cx="960" cy="214" r="7" fill="#a63f32"/>
    <circle cx="1080" cy="176" r="8" fill="#172b35"/>
    <text x="120" y="248" class="sans" fill="#75695a" font-size="18" letter-spacing="2">点を、</text>
    <text x="1080" y="216" class="sans" fill="#172b35" font-size="18" letter-spacing="2" text-anchor="end">線に。</text>
  </g>

  <!-- headline -->
  <text x="80" y="358" class="serif" fill="#172b35" font-size="76" font-weight="700">44市町村を、</text>
  <text x="80" y="456" class="serif" fill="#172b35" font-size="88" font-weight="700">「巡る旅」へ<tspan class="serif" font-size="64" fill="#a63f32">。</tspan></text>

  <!-- sub copy -->
  <text x="82" y="526" class="serif" fill="#315c68" font-size="34" font-weight="500">IBARAKI PASSPORTから考える、これからの茨城観光</text>

  <!-- footnote -->
  <text x="1120" y="574" class="sans" fill="#75695a" font-size="19" text-anchor="end">IBARAKI PASSPORT ／ 2026年10月上旬 交付予定</text>
</svg>
