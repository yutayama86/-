<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="茨城県の道路冠水危険箇所33か所をテーマにしたイバトコの記事画像">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="2"/>

  <text x="76" y="104" font-family="'Source Sans 3', sans-serif" font-size="21" font-weight="600" letter-spacing="4.5" fill="#75695a">IBATOCO ・ 茨城ニュース解説</text>

  <g fill="none" stroke="#315c68" stroke-width="2">
    <path d="M76 150 H468" stroke-dasharray="8 7"/>
    <path d="M76 170 H172 L244 234 H408 L480 170 H600"/>
  </g>
  <text x="490" y="156" font-family="'Shippori Mincho', serif" font-size="19" fill="#75695a">線路・幹線道路</text>
  <path d="M244 234 H408 L408 216 L244 216 Z" fill="#315c68" opacity=".22"/>
  <text x="76" y="268" font-family="'Shippori Mincho', serif" font-size="19" fill="#315c68">くぐる道は、周りより低い</text>

  <g>
    <circle cx="800" cy="192" r="60" fill="none" stroke="#a63f32" stroke-width="2"/>
    <text x="800" y="184" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="42" font-weight="700" fill="#a63f32">33</text>
    <text x="800" y="214" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="17" font-weight="600" fill="#a63f32">か所</text>
    <text x="886" y="186" font-family="'Shippori Mincho', serif" font-size="19" fill="#75695a">県が公表する</text>
    <text x="886" y="213" font-family="'Shippori Mincho', serif" font-size="19" fill="#75695a">道路冠水危険箇所</text>
  </g>

  <path d="M76 306 H1124" stroke="#d9d0c0" stroke-width="1"/>

  <text x="76" y="366" font-family="'Shippori Mincho', serif" font-size="50" font-weight="700" fill="#172b35">茨城のアンダーパス33か所と、</text>
  <text x="76" y="428" font-family="'Shippori Mincho', serif" font-size="50" font-weight="700" fill="#172b35">入ってはいけない理由。</text>

  <text x="76" y="484" font-family="'Shippori Mincho', serif" font-size="24" fill="#75695a">市町村別の全一覧／水深とドアの関係／確認先</text>

  <text x="76" y="556" font-family="'Source Sans 3', sans-serif" font-size="18" fill="#75695a">出典：茨城県 道路冠水危険箇所一覧（2026年9月1日更新）／国土交通省</text>
  <text x="1124" y="556" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="18" letter-spacing="2" fill="#75695a">ibatoco.jp</text>
</svg>
