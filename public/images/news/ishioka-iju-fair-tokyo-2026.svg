<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="仕事は東京に残したまま暮らす場所だけを移す、という移住のかたちを示した図">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d9d0c0" stroke-width="2"/>

  <text x="100" y="122" font-family="'Source Sans 3', sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#315c68">IBATOCO ・ 茨城ニュース解説</text>

  <g font-family="'Source Sans 3', sans-serif" font-size="19" fill="#75695a">
    <text x="100" y="186">仕事</text>
    <text x="100" y="266">暮らす場所</text>
  </g>

  <g fill="none" stroke="#75695a" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.6">
    <path d="M240 180 H700"/>
  </g>
  <circle cx="240" cy="180" r="7" fill="#75695a"/>
  <circle cx="700" cy="180" r="7" fill="#75695a"/>
  <text x="712" y="186" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#75695a">東京のまま</text>

  <g fill="none" stroke="#a63f32" stroke-width="2.4">
    <path d="M240 260 H700"/>
    <path d="M676 249 L700 260 L676 271"/>
  </g>
  <circle cx="240" cy="260" r="7" fill="#a63f32"/>
  <text x="712" y="266" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#a63f32">石岡へ</text>

  <text x="1100" y="186" font-family="'Source Sans 3', sans-serif" font-size="17" fill="#75695a" text-anchor="end">東京</text>
  <text x="1100" y="266" font-family="'Source Sans 3', sans-serif" font-size="17" fill="#75695a" text-anchor="end">茨城</text>

  <text x="100" y="380" font-family="'Shippori Mincho', serif" font-size="62" font-weight="600" fill="#172b35">仕事を変えずに、</text>
  <text x="100" y="460" font-family="'Shippori Mincho', serif" font-size="62" font-weight="600" fill="#172b35">住む場所だけ変える。</text>

  <text x="100" y="518" font-family="'Shippori Mincho', serif" font-size="26" fill="#315c68">石岡市が東京で3か月連続の移住フェアへ出展</text>

  <text x="1100" y="558" font-family="'Source Sans 3', sans-serif" font-size="18" fill="#75695a" text-anchor="end">2026年9月〜11月 ／ 支援金にはテレワーク要件と住宅取得要件</text>
</svg>
