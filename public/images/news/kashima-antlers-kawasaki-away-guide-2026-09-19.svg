<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="鹿島アントラーズ川崎遠征ガイド。9月19日のUvanceとどろきスタジアムの流れ。7時に列の開始、13時30分フロンパーク、16時開門、18時キックオフ">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="1"/>

  <text x="80" y="96" font-family="'Source Sans 3', sans-serif" font-size="20" letter-spacing="2.4" fill="#a63f32">IBATOCO ・ SPORTS ・ 遠征ガイド</text>

  <g>
    <line x1="104" y1="160" x2="786" y2="160" stroke="#315c68" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="104" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="331" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="558" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="786" cy="160" r="16" fill="#a63f32"/>

    <text x="104" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">7:00</text>
    <text x="331" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">13:30</text>
    <text x="558" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">16:00</text>
    <text x="786" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#a63f32">18:00</text>

    <text x="104" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">13番ゲート前で列</text>
    <text x="331" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">フロンパーク</text>
    <text x="558" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">一般開門</text>
    <text x="786" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">キックオフ</text>
  </g>

  <text x="80" y="330" font-family="'Shippori Mincho', serif" font-size="50" font-weight="700" fill="#172b35">鹿島アントラーズ</text>
  <text x="80" y="396" font-family="'Shippori Mincho', serif" font-size="50" font-weight="700" fill="#172b35">川崎遠征ガイド</text>
  <text x="80" y="458" font-family="'Shippori Mincho', serif" font-size="36" font-weight="700" fill="#315c68">9/19 U等々力・ビジター席で知っておくこと</text>

  <line x1="80" y1="496" x2="300" y2="496" stroke="#a63f32" stroke-width="3"/>

  <text x="80" y="538" font-family="'Source Sans 3', sans-serif" font-size="21" fill="#75695a">入場ゲート ・ チケット ・ 応援ルール ・ アクセス ・ 駐車場</text>
  <text x="80" y="576" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">出典：川崎フロンターレ・Jリーグチケットほか公式情報</text>
</svg>
