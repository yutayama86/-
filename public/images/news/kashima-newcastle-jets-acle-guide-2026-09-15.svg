<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="鹿島アントラーズ vs ニューカッスル・ジェッツ 9月15日 ACLE初戦の観戦ガイド。16時の場外飲食店オープン、17時開場、19時キックオフ、21時試合終了予定">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="1"/>

  <text x="80" y="96" font-family="'Source Sans 3', sans-serif" font-size="20" letter-spacing="2.4" fill="#a63f32">IBATOCO ・ SPORTS ・ 観戦ガイド</text>

  <g>
    <line x1="104" y1="160" x2="786" y2="160" stroke="#315c68" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="104" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="331" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="558" cy="160" r="16" fill="#a63f32"/>
    <circle cx="786" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>

    <text x="104" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">16:00</text>
    <text x="331" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">17:00</text>
    <text x="558" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#a63f32">19:00</text>
    <text x="786" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">21:00頃</text>

    <text x="104" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">場外飲食</text>
    <text x="331" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">開場</text>
    <text x="558" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">キックオフ</text>
    <text x="786" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">試合終了予定</text>
  </g>

  <text x="80" y="330" font-family="'Shippori Mincho', serif" font-size="48" font-weight="700" fill="#172b35">鹿島アントラーズ</text>
  <text x="80" y="394" font-family="'Shippori Mincho', serif" font-size="48" font-weight="700" fill="#172b35">vs ニューカッスル・ジェッツ</text>
  <text x="80" y="458" font-family="'Shippori Mincho', serif" font-size="38" font-weight="700" fill="#315c68">9/15 ACLE初戦の観戦ガイド</text>

  <line x1="80" y1="496" x2="300" y2="496" stroke="#a63f32" stroke-width="3"/>

  <text x="80" y="538" font-family="'Source Sans 3', sans-serif" font-size="21" fill="#75695a">チケット ・ アクセス ・ 帰りの電車 ・ スタジアムグルメ</text>
  <text x="80" y="576" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">出典：鹿島アントラーズ・鹿島臨海鉄道ほか公式情報</text>
</svg>
