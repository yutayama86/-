<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="J1観戦を試合だけで終わらせない。水戸ホーリーホックから広がる茨城のサッカーツーリズム">
  <defs>
    <style>
      .serif{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;}
      .sans{font-family:'Source Sans 3','Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#d9d0c0" stroke-width="1.5"/>

  <!-- kicker -->
  <text x="80" y="108" class="sans" fill="#315c68" font-size="22" letter-spacing="4" font-weight="600">IBATOCO ・ 茨城ニュース解説</text>

  <!-- match to town: ball on the left, spreading out to visitor spots on the right -->
  <g>
    <path d="M228 200 C 430 130, 560 250, 760 180 T 1040 172" fill="none" stroke="#315c68" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <!-- football (abstract, no team marks) -->
    <circle cx="190" cy="200" r="36" fill="#fff" stroke="#172b35" stroke-width="3"/>
    <path d="M190 180 l17 12 -6 20 -22 0 -6 -20 z" fill="#172b35"/>
    <line x1="190" y1="164" x2="190" y2="180" stroke="#172b35" stroke-width="2"/>
    <line x1="164" y1="196" x2="179" y2="192" stroke="#172b35" stroke-width="2"/>
    <line x1="216" y1="196" x2="201" y2="192" stroke="#172b35" stroke-width="2"/>
    <!-- visitor spots -->
    <circle cx="760" cy="180" r="9" fill="#a63f32"/>
    <circle cx="900" cy="205" r="9" fill="#315c68"/>
    <circle cx="1040" cy="172" r="9" fill="#172b35"/>
    <text x="150" y="262" class="sans" fill="#75695a" font-size="19" letter-spacing="2" text-anchor="middle">KICK OFF</text>
    <text x="1040" y="210" class="sans" fill="#75695a" font-size="19" letter-spacing="2" text-anchor="middle">周遊</text>
  </g>

  <!-- headline -->
  <text x="80" y="360" class="serif" fill="#172b35" font-size="70" font-weight="700">J1観戦を、</text>
  <text x="80" y="452" class="serif" fill="#172b35" font-size="70" font-weight="700">試合だけで終わらせない<tspan class="serif" fill="#a63f32">。</tspan></text>

  <!-- sub copy -->
  <text x="82" y="524" class="serif" fill="#315c68" font-size="36" font-weight="500">水戸ホーリーホックから広がる、茨城のサッカーツーリズム</text>

  <!-- footnote -->
  <text x="1120" y="574" class="sans" fill="#75695a" font-size="19" text-anchor="end">水戸ホーリーホック ／ J1（2026シーズン初参戦）</text>
</svg>
