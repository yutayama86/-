<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="水戸ホーリーホック横浜遠征ガイド。9月19日の日産スタジアムの流れ。15時キッチンカー、17時開門、19時30分キックオフ、21時15分試合終了の目安">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9d0c0" stroke-width="1"/>

  <text x="80" y="96" font-family="'Source Sans 3', sans-serif" font-size="20" letter-spacing="2.4" fill="#a63f32">IBATOCO ・ SPORTS ・ 遠征ガイド</text>

  <g>
    <line x1="104" y1="160" x2="786" y2="160" stroke="#315c68" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="104" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="331" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>
    <circle cx="558" cy="160" r="16" fill="#a63f32"/>
    <circle cx="786" cy="160" r="11" fill="#f6f2e9" stroke="#315c68" stroke-width="2.5"/>

    <text x="104" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">15:00</text>
    <text x="331" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">17:00</text>
    <text x="558" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#a63f32">19:30</text>
    <text x="786" y="206" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="19" fill="#172b35">21:15頃</text>

    <text x="104" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">キッチンカー</text>
    <text x="331" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">開門</text>
    <text x="558" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">キックオフ</text>
    <text x="786" y="232" text-anchor="middle" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">試合終了（目安）</text>
  </g>

  <text x="80" y="330" font-family="'Shippori Mincho', serif" font-size="50" font-weight="700" fill="#172b35">水戸ホーリーホック</text>
  <text x="80" y="396" font-family="'Shippori Mincho', serif" font-size="50" font-weight="700" fill="#172b35">横浜遠征ガイド</text>
  <text x="80" y="458" font-family="'Shippori Mincho', serif" font-size="36" font-weight="700" fill="#315c68">9/19 日産スタジアム・ビジター席で知っておくこと</text>

  <line x1="80" y1="496" x2="300" y2="496" stroke="#a63f32" stroke-width="3"/>

  <text x="80" y="538" font-family="'Source Sans 3', sans-serif" font-size="21" fill="#75695a">アクセス ・ ビジター席 ・ チケット ・ イベント ・ グルメ</text>
  <text x="80" y="576" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a">出典：横浜F・マリノス・日産スタジアムほか公式情報</text>
</svg>
