<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="水戸4対2鹿島のスコアと、渡邉新太が8分・21分・48分・83分に決めた4得点、レオセアラが53分・55分に決めた2得点を時間軸で示した図">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d9d0c0" stroke-width="2"/>

  <text x="100" y="118" font-family="'Source Sans 3', sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#315c68">IBATOCO ・ 茨城のスポーツ</text>
  <text x="100" y="166" font-family="'Source Sans 3', sans-serif" font-size="17" fill="#75695a">2026年9月2日（水）／ 明治安田J1リーグ 第5節 ／ 水戸信用金庫スタジアム</text>

  <g font-family="'Shippori Mincho', serif" text-anchor="middle">
    <text x="290" y="252" font-size="30" font-weight="600" fill="#315c68">水戸ホーリーホック</text>
    <text x="290" y="322" font-size="66" font-weight="600" fill="#315c68">4</text>
    <text x="600" y="310" font-family="'Source Sans 3', sans-serif" font-size="34" fill="#75695a">-</text>
    <text x="910" y="252" font-size="30" font-weight="600" fill="#a63f32">鹿島アントラーズ</text>
    <text x="910" y="322" font-size="66" font-weight="600" fill="#a63f32">2</text>
  </g>
  <text x="600" y="352" font-family="'Source Sans 3', sans-serif" font-size="15" fill="#75695a" text-anchor="middle">ハーフタイム 2 - 0</text>

  <line x1="100" y1="410" x2="1016" y2="410" stroke="#d9d0c0" stroke-width="2"/>
  <g font-family="'Source Sans 3', sans-serif" text-anchor="middle">
    <circle cx="180" cy="410" r="6" fill="#315c68"/><text x="180" y="438" font-size="15" fill="#315c68">8分</text>
    <circle cx="282" cy="410" r="6" fill="#315c68"/><text x="282" y="438" font-size="15" fill="#315c68">21分</text>
    <circle cx="530" cy="410" r="6" fill="#315c68"/><text x="530" y="438" font-size="15" fill="#315c68">48分</text>
    <circle cx="580" cy="410" r="6" fill="#a63f32"/><text x="580" y="392" font-size="15" fill="#a63f32">53分</text>
    <circle cx="622" cy="410" r="6" fill="#a63f32"/><text x="632" y="392" font-size="15" fill="#a63f32">55分</text>
    <circle cx="920" cy="410" r="6" fill="#315c68"/><text x="920" y="438" font-size="15" fill="#315c68">83分</text>
  </g>
  <text x="100" y="478" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#315c68">渡邉 新太（水戸）4得点</text>
  <text x="360" y="478" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#a63f32">レオ セアラ（鹿島）2得点</text>

  <text x="100" y="546" font-family="'Shippori Mincho', serif" font-size="40" font-weight="600" fill="#172b35">J1初の茨城ダービー。</text>
  <text x="1100" y="524" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a" text-anchor="end">入場者数 14,506人</text>
  <text x="1100" y="552" font-family="'Source Sans 3', sans-serif" font-size="16" fill="#75695a" text-anchor="end">鹿島は開幕4連勝からの今季初黒星</text>
</svg>
